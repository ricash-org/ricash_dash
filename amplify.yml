version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
        - test -d out || (echo "ERREUR: le dossier out/ est absent (export statique Next.js)" && exit 1)
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
